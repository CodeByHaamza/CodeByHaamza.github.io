<style>

    --bg: #f6f7f9; --card: #fff; --text: #16181d;
    --muted: #6b7280; --line: #e3e6ea; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {

      --muted: #9aa1ab; --line: #262b34; --accent: #6ea0ff;

    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: inherit; text-decoration: none; font-weight: 600;
    transition: border-color .15s;
  }
  a.go:hover, a.go:focus-visible { border-color: var(--accent); }
  a.go .desc {
    display: block; margin-top: 3px;
    font-weight: 400; font-size: 0.83rem; color: var(--muted);
