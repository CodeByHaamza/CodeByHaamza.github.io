name: Deployer le site

on:
  push:
    branches: [main]
  schedule:
    # Tous les jours : les chiffres GitHub sont figes au build, donc sans
    # reconstruction periodique le compteur de commits vieillirait.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Construire
        env:
          # outils/chiffres.mjs appelle l'API via gh avant le build.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: npm run build

      - name: Verifier que la page n'est pas vide
        run: |
          # Ce qui doit etre vrai quelle que soit la vue par defaut : le
          # point de montage et le bundle construit. La verification
          # precedente cherchait le champ du terminal, qui a cesse d'exister
          # dans index.html le jour ou la vue classique est devenue le
          # defaut ; elle a bloque le deploiement, ce qui etait son role,
          # mais sur un invariant perime.
          test -s dist/index.html
          grep -q 'id="app"' dist/index.html
          grep -qE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html
          # Pas `test -s dist/assets/*.js` : le glob passerait plusieurs
          # arguments a test des que Vite decoupe le bundle.
          test "$(find dist/assets -name '*.js' -size +1k | wc -l)" -ge 1
          # Chaque adresse doit avoir son fichier, sinon Pages repond 404
          # et la page n'est ni indexee ni previsualisee quand on la
          # partage. postbuild les ecrit ; on verifie qu'il l'a fait.
          for p in projets a-propos contact projets/kagami; do
            test -s "dist/$p/index.html" || { echo "manque: $p"; exit 1; }
          done
          test -s dist/404.html
          echo "toutes les routes ont leur fichier"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
